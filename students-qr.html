<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR அடையாள அட்டைகள் | Student, Teacher & Admin QR Badges - TBTA</title>
  <meta name="description" content="Printable and interactive QR Code Badges for Students, Teachers, and Admin across Nilai 1 to Nilai 8.">
  <meta name="theme-color" content="#2B1055">
  
  <link rel="stylesheet" href="css/style.css?v=20261004-qr-v2">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🪪</text></svg>">

  <style>
    body {
      background: var(--bg-gradient);
      min-height: 100vh;
      color: var(--text-light);
      padding: 20px 16px 40px;
    }

    .qr-page-container {
      max-width: 1240px;
      margin: 0 auto;
      width: 100%;
    }

    .qr-header-card {
      background: rgba(255, 255, 255, 0.96);
      color: var(--text-dark);
      border-radius: var(--radius-lg);
      padding: 24px 28px;
      margin-bottom: 24px;
      box-shadow: var(--glass-shadow);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .qr-header-titles {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .qr-brand-logo {
      font-size: 3rem;
      background: #EDE9FE;
      width: 68px;
      height: 68px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(108, 92, 231, 0.2);
    }

    .qr-page-title {
      font-family: var(--font-kid);
      font-size: 1.7rem;
      font-weight: 800;
      color: #1E1B4B;
      line-height: 1.2;
    }

    .qr-page-sub {
      font-family: var(--font-tamil);
      font-size: 0.95rem;
      font-weight: 600;
      color: #4B5563;
      margin-top: 4px;
    }

    .qr-header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .qr-btn {
      padding: 10px 18px;
      border-radius: var(--radius-full);
      border: none;
      font-family: var(--font-tamil);
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      text-decoration: none;
    }

    .qr-btn.primary {
      background: linear-gradient(135deg, var(--secondary), var(--primary));
      color: #FFF;
      box-shadow: 0 4px 14px rgba(108, 92, 231, 0.4);
    }

    .qr-btn.secondary {
      background: #F1F5F9;
      color: #1E293B;
      border: 1px solid #CBD5E1;
    }

    .qr-btn:hover {
      transform: translateY(-2px);
    }

    /* Controls card */
    .qr-controls-card {
      background: rgba(255, 255, 255, 0.95);
      color: var(--text-dark);
      border-radius: var(--radius-lg);
      padding: 20px 24px;
      margin-bottom: 24px;
      box-shadow: var(--glass-shadow);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .qr-role-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      padding-bottom: 8px;
      border-bottom: 2px solid #E2E8F0;
    }

    .role-tab-btn {
      padding: 10px 20px;
      border-radius: var(--radius-full);
      border: 2px solid #CBD5E1;
      background: #FFFFFF;
      color: #334155;
      font-family: var(--font-tamil);
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .role-tab-btn.active {
      background: linear-gradient(135deg, #2563EB, #7C3AED);
      color: #FFFFFF;
      border-color: transparent;
      box-shadow: 0 4px 12px rgba(124, 58, 237, 0.35);
    }

    .role-tab-btn.teacher-tab.active {
      background: linear-gradient(135deg, #059669, #10B981);
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4);
    }

    .role-tab-btn.admin-tab.active {
      background: linear-gradient(135deg, #7C3AED, #9333EA);
      box-shadow: 0 4px 12px rgba(147, 51, 234, 0.4);
    }

    .qr-search-row {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .qr-search-input {
      flex: 1;
      padding: 12px 18px;
      border-radius: var(--radius-full);
      border: 2px solid #E2E8F0;
      font-family: var(--font-tamil);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .qr-search-input:focus {
      border-color: var(--secondary);
      box-shadow: 0 0 0 4px rgba(108, 92, 231, 0.15);
    }

    .qr-grade-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .qr-club-filters {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    .qr-club-filter-title {
      color: #475569;
      font-weight: 800;
      margin-right: 4px;
    }

    .qr-club-filter {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 12px;
      border: 1px solid #CBD5E1;
      border-radius: var(--radius-full);
      background: #F8FAFC;
      color: #334155;
      font-size: .88rem;
      font-weight: 700;
      cursor: pointer;
    }

    .qr-club-filter input {
      width: 17px;
      height: 17px;
      accent-color: #6C5CE7;
    }

    .qr-batch-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
    }

    .qr-batch-count {
      color: #475569;
      font-size: .88rem;
      font-weight: 700;
    }

    .badge-download-btn {
      margin-top: 8px;
      padding: 7px 12px;
      border: 1px solid #C7D2FE;
      border-radius: var(--radius-full);
      background: #EEF2FF;
      color: #4338CA;
      font: inherit;
      font-size: .8rem;
      font-weight: 700;
      cursor: pointer;
    }

    .badge-download-btn:hover {
      background: #E0E7FF;
    }

    .badge-card-download-btn {
      margin-top: 10px;
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #C7D2FE;
      border-radius: var(--radius-full);
      background: #EEF2FF;
      color: #4338CA;
      font: inherit;
      font-size: .8rem;
      font-weight: 700;
      cursor: pointer;
    }

    .qr-batch-status {
      min-height: 1.2em;
      color: #475569;
      font-size: .85rem;
      font-weight: 700;
    }

    .grade-tab-btn {
      padding: 8px 14px;
      border-radius: var(--radius-full);
      border: 1px solid #CBD5E1;
      background: #F8FAFC;
      color: #334155;
      font-family: var(--font-tamil);
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .grade-tab-btn.active {
      background: var(--secondary);
      color: #FFF;
      border-color: var(--secondary);
    }

    /* Badges Grid */
    .qr-badges-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 22px;
    }

    /* Badge Card */
    .student-badge-card {
      background: #FFFFFF;
      color: #1E293B;
      border-radius: 20px;
      padding: 18px 16px;
      box-shadow: 0 10px 24px rgba(0,0,0,0.18);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      position: relative;
      overflow: hidden;
      border: 2px solid #E2E8F0;
      transition: transform 0.2s, box-shadow 0.2s;
      page-break-inside: avoid;
    }

    .student-badge-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 16px 32px rgba(0,0,0,0.28);
    }

    /* Distinct Staff Cards */
    .student-badge-card.card-teacher {
      border: 2.5px solid #10B981;
      background: linear-gradient(180deg, #F0FDF4 0%, #FFFFFF 60%);
    }

    .student-badge-card.card-admin {
      border: 2.5px solid #8B5CF6;
      background: linear-gradient(180deg, #F5F3FF 0%, #FFFFFF 60%);
    }

    .badge-top-strip {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px dashed #E2E8F0;
    }

    .badge-school-tag {
      font-size: 0.72rem;
      font-weight: 800;
      color: #6C5CE7;
      display: flex;
      align-items: center;
      gap: 4px;
      font-family: var(--font-kid);
      text-transform: uppercase;
    }

    .badge-grade-pill {
      font-family: var(--font-tamil);
      font-size: 0.76rem;
      font-weight: 800;
      padding: 3px 10px;
      border-radius: var(--radius-full);
      background: #EDE9FE;
      color: #5B21B6;
    }

    .badge-grade-pill.pill-teacher {
      background: #D1FAE5;
      color: #065F46;
      font-size: 0.82rem;
    }

    .badge-grade-pill.pill-admin {
      background: #EDE9FE;
      color: #6D28D9;
      font-size: 0.82rem;
    }

    .badge-grade-pill.grade-1 { background: #FEF3C7; color: #92400E; }
    .badge-grade-pill.grade-2 { background: #EDE9FE; color: #5B21B6; }
    .badge-grade-pill.grade-3 { background: #DCFCE7; color: #166534; }
    .badge-grade-pill.grade-4 { background: #E0F2FE; color: #0369A1; }
    .badge-grade-pill.grade-5 { background: #FCE7F3; color: #9D174D; }
    .badge-grade-pill.grade-6 { background: #FFEDD5; color: #9A3412; }
    .badge-grade-pill.grade-7 { background: #F3E8FF; color: #6B21A8; }
    .badge-grade-pill.grade-8 { background: #CCFBF1; color: #115E59; }

    .badge-student-name {
      font-family: var(--font-kid);
      font-size: 1.35rem;
      font-weight: 800;
      color: #0F172A;
      line-height: 1.2;
      margin: 2px 0 4px;
      min-height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .badge-sub-title {
      font-family: var(--font-tamil);
      font-size: 0.78rem;
      color: #64748B;
      margin-bottom: 8px;
    }

    .badge-qr-container {
      background: #F8FAFC;
      border: 2px solid #CBD5E1;
      border-radius: 14px;
      padding: 10px;
      margin: 4px 0 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 170px;
      height: 170px;
    }

    .card-teacher .badge-qr-container {
      border-color: #10B981;
      background: #ECFDF5;
    }

    .card-admin .badge-qr-container {
      border-color: #8B5CF6;
      background: #F5F3FF;
    }

    .badge-qr-container canvas, .badge-qr-container img {
      max-width: 150px;
      max-height: 150px;
      display: block;
    }

    .badge-id-tag {
      font-family: var(--font-main);
      font-size: 0.74rem;
      font-weight: 700;
      color: #64748B;
      letter-spacing: 0.5px;
    }

    .badge-scan-hint {
      font-family: var(--font-tamil);
      font-size: 0.76rem;
      color: #059669;
      font-weight: 700;
      margin-top: 4px;
    }

    .badge-quick-launch-btn {
      margin-top: 10px;
      width: 100%;
      padding: 7px 12px;
      border-radius: var(--radius-full);
      background: #F1F5F9;
      border: 1px solid #CBD5E1;
      color: #1E293B;
      font-size: 0.8rem;
      font-family: var(--font-tamil);
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .badge-quick-launch-btn:hover {
      background: #E2E8F0;
      color: #0F172A;
    }

    .card-teacher .badge-quick-launch-btn {
      background: #ECFDF5;
      color: #065F46;
      border-color: #A7F3D0;
    }

    .card-admin .badge-quick-launch-btn {
      background: #F5F3FF;
      color: #5B21B6;
      border-color: #DDD6FE;
    }

    .no-results-box {
      grid-column: 1 / -1;
      background: rgba(255, 255, 255, 0.95);
      color: #1E293B;
      border-radius: var(--radius-lg);
      padding: 40px 20px;
      text-align: center;
    }

    /* Print Optimized Styling */
    @media print {
      body {
        background: #FFFFFF !important;
        color: #000000 !important;
        padding: 0 !important;
      }

      .bg-bubbles, #confetti-canvas, .qr-controls-card, .qr-header-actions, .badge-quick-launch-btn, .badge-download-btn, .badge-card-download-btn {
        display: none !important;
      }

      .qr-header-card {
        box-shadow: none !important;
        border: none !important;
        padding: 10px 0 !important;
        margin-bottom: 12px !important;
      }

      .qr-badges-grid {
        grid-template-columns: repeat(3, 1fr) !important;
        gap: 12px !important;
      }

      .student-badge-card {
        border: 1px dashed #64748B !important;
        box-shadow: none !important;
        padding: 12px !important;
        page-break-inside: avoid !important;
        break-inside: avoid !important;
      }

      .badge-qr-container {
        border-color: #94A3B8 !important;
      }
    }
  </style>
</head>
<body>
  <div class="qr-page-container">
    <!-- Top Header Card -->
    <header class="qr-header-card">
      <div class="qr-header-titles">
        <div class="qr-brand-logo">🪪</div>
        <div>
          <h1 class="qr-page-title">QR அடையாள அட்டைகள் (ID Badges Portal)</h1>
          <p class="qr-page-sub">மாணவர், ஆசிரியர் மற்றும் நிர்வாகத்திற்கான உடனடி QR உள்நுழைவு அட்டைகள்</p>
        </div>
      </div>
      <div class="qr-header-actions">
        <a href="clubs-management.html" class="qr-btn" style="background: linear-gradient(135deg, #059669, #10B981); color: #FFF; box-shadow: 0 4px 14px rgba(16, 185, 129, 0.35);">
          <span>🏛️</span> மாணவர் மன்றப் பதிவுகள்
        </a>
        <button class="qr-btn primary" id="print-badges-btn">
          <span>🖨️</span> அச்சிடுக (Print Badges)
        </button>
        <a href="index.html" class="qr-btn secondary">
          <span>🚀</span> முகப்பு உள்நுழைவு (App Login)
        </a>
      </div>
    </header>

    <!-- Filter & Search Controls -->
    <section class="qr-controls-card" aria-label="Student Filters">
      <!-- Main Category Tabs -->
      <div class="qr-role-tabs" id="qr-role-tabs">
        <button class="role-tab-btn active" data-role="all">✨ அனைத்து அட்டைகளும் (All Badges)</button>
        <button class="role-tab-btn teacher-tab" data-role="teacher">👩‍🏫 ஆசிரியர் QR (Teacher QR)</button>
        <button class="role-tab-btn admin-tab" data-role="admin">🛡️ நிர்வாகம் QR (Admin QR)</button>
        <button class="role-tab-btn" data-role="students" id="students-role-tab">👨‍🎓 மாணவர்கள் மட்டும்</button>
      </div>

      <div class="qr-search-row">
        <input type="text" id="qr-search-input" class="qr-search-input" placeholder="🔍 மாணவர் / ஆசிரியர் / நிர்வாக பெயரைத் தேடவும்..." aria-label="Search badge">
      </div>

      <div class="qr-grade-tabs" id="qr-grade-tabs">
        <button class="grade-tab-btn active" data-grade="all">அனைத்து வகுப்புகள் (All)</button>
        <button class="grade-tab-btn" data-grade="1">1-ஆம் வகுப்பு (Nilai 1 · 9)</button>
        <button class="grade-tab-btn" data-grade="2">2-ஆம் வகுப்பு (Nilai 2 · 20)</button>
        <button class="grade-tab-btn" data-grade="3">3-ஆம் வகுப்பு (Nilai 3 · 20)</button>
        <button class="grade-tab-btn" data-grade="4">4-ஆம் வகுப்பு (Nilai 4 · 19)</button>
        <button class="grade-tab-btn" data-grade="5">5-ஆம் வகுப்பு (Nilai 5 · 9)</button>
        <button class="grade-tab-btn" data-grade="6">6-ஆம் வகுப்பு (Nilai 6 · 8)</button>
        <button class="grade-tab-btn" data-grade="7">7-ஆம் வகுப்பு (Nilai 7 · 2)</button>
        <button class="grade-tab-btn" data-grade="8">8-ஆம் வகுப்பு (Nilai 8 · 7)</button>
      </div>

      <div class="qr-club-filters" id="qr-club-filters" role="group" aria-label="Filter students by club">
        <span class="qr-club-filter-title">Filter by club (any selected; none = all students):</span>
        <label class="qr-club-filter"><input type="checkbox" value="reading"> Reading Club</label>
        <label class="qr-club-filter"><input type="checkbox" value="thirukkural"> Thirukkural</label>
        <label class="qr-club-filter"><input type="checkbox" value="aathichudi"> Aathichudi</label>
        <label class="qr-club-filter"><input type="checkbox" value="school"> School Topic</label>
      </div>

      <div class="qr-batch-actions">
        <button class="qr-btn primary" id="download-qr-batch-btn" type="button">⬇️ Download full badge batch (.zip)</button>
        <span class="qr-batch-count" id="qr-batch-count" aria-live="polite"></span>
        <span class="qr-batch-status" id="qr-batch-status" role="status" aria-live="polite"></span>
      </div>
    </section>

    <!-- Badges Grid Container -->
    <main class="qr-badges-grid" id="qr-badges-grid">
      <div class="no-results-box">
        <h3>அடையாள அட்டைகளை ஏற்றுகிறது (Loading badges)...</h3>
      </div>
    </main>
  </div>

  <!-- QR Code Generation Script -->
  <script src="js/lib/qrcode.min.js"></script>
  <script>
    (function () {
      let allStudents = [];
      const CUSTOM_STUDENTS_KEY = "tbta_custom_students";
      let currentRoleTab = "all"; // 'all' | 'teacher' | 'admin' | 'students'
      let currentGradeFilter = "all";
      let currentSearchQuery = "";
      let currentStudentIdFilter = "";
      const SCHOOLS = ["FHS", "CHS", "RHS", "Online"];
      let studentEnrollments = {};

      const STAFF_BADGES = [
        {
          type: "TBTA_TEACHER",
          role: "teacher",
          fullName: "தமிழ் ஆசிரியர் (Tamil Teacher)",
          subtitle: "வாசிப்பு மன்றம் & தமிழ் மொழி ஆசிரியர் (Nilai 1 - 8)",
          pillText: "👩‍🏫 ஆசிரியர் (Teacher)",
          pillClass: "pill-teacher",
          cardClass: "card-teacher",
          id: "TBTA-TEACHER-01",
          loginUrl: "index.html#teacher",
          qrPayload: JSON.stringify({
            type: "TBTA_TEACHER",
            role: "teacher",
            name: "Tamil Teacher",
            id: "TBTA-TEACHER-01"
          })
        },
        {
          type: "TBTA_ADMIN",
          role: "admin",
          fullName: "தலைமை நிர்வாகி (Administrator)",
          subtitle: "கல்வி மற்றும் அமைப்பு மேலாண்மை (Admin)",
          pillText: "🛡️ நிர்வாகம் (Admin)",
          pillClass: "pill-admin",
          cardClass: "card-admin",
          id: "TBTA-ADMIN-01",
          loginUrl: "index.html#admin",
          qrPayload: JSON.stringify({
            type: "TBTA_ADMIN",
            role: "admin",
            name: "TBTA Administrator",
            id: "TBTA-ADMIN-01"
          })
        }
      ];

      const grid = document.getElementById("qr-badges-grid");
      const searchInput = document.getElementById("qr-search-input");
      const roleTabs = document.querySelectorAll(".role-tab-btn");
      const gradeTabs = document.querySelectorAll(".grade-tab-btn");
      const gradeTabsContainer = document.getElementById("qr-grade-tabs");
      const printBtn = document.getElementById("print-badges-btn");
      const clubFilters = document.getElementById("qr-club-filters");
      const batchButton = document.getElementById("download-qr-batch-btn");
      const batchCount = document.getElementById("qr-batch-count");
      const batchStatus = document.getElementById("qr-batch-status");

      function escapeHtml(value) {
        return String(value == null ? "" : value).replace(/[&<>'"]/g, char => ({
          "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;"
        }[char]));
      }

      function getStudentKey(student) {
        return student.id || `${student.firstName}_${student.lastName}_G${student.grade}`;
      }

      function getStudentClubs(student) {
        const enrollment = studentEnrollments[getStudentKey(student)];
        return enrollment && Array.isArray(enrollment.clubs)
          ? enrollment.clubs
          : (Array.isArray(student.clubs) ? student.clubs : []);
      }

      function getSelectedClubs() {
        return [...clubFilters.querySelectorAll('input[type="checkbox"]:checked')].map(input => input.value);
      }

      function getVisibleStudents() {
        const selectedClubs = getSelectedClubs();
        return allStudents.filter(student => {
          const matchesGrade = currentGradeFilter === "all" || String(student.grade) === String(currentGradeFilter);
          const fullName = `${student.firstName} ${student.lastName}`.toLowerCase();
          const matchesSearch = !currentSearchQuery || fullName.includes(currentSearchQuery);
          const key = getStudentKey(student);
          const matchesStudent = !currentStudentIdFilter || key === currentStudentIdFilter;
          const matchesClubs = !selectedClubs.length || getStudentClubs(student).some(club => selectedClubs.includes(club));
          return matchesGrade && matchesSearch && matchesStudent && matchesClubs;
        });
      }

      function getStudentQrPayload(student) {
        const studentId = student.id || `TBTA-G${student.grade}-${String(allStudents.indexOf(student) + 1).padStart(2, "0")}`;
        return JSON.stringify({
          type: "TBTA_STUDENT",
          firstName: student.firstName,
          lastName: student.lastName,
          grade: student.grade,
          school: student.school || "RHS",
          id: studentId,
          clubs: getStudentClubs(student)
        });
      }

      function drawRoundedRect(context, x, y, width, height, radius, fill, stroke, lineWidth = 1) {
        context.beginPath();
        context.moveTo(x + radius, y);
        context.arcTo(x + width, y, x + width, y + height, radius);
        context.arcTo(x + width, y + height, x, y + height, radius);
        context.arcTo(x, y + height, x, y, radius);
        context.arcTo(x, y, x + width, y, radius);
        context.closePath();
        if (fill) {
          context.fillStyle = fill;
          context.fill();
        }
        if (stroke) {
          context.strokeStyle = stroke;
          context.lineWidth = lineWidth;
          context.stroke();
        }
      }

      function drawCenteredText(context, text, x, y, maxWidth, font, color) {
        context.font = font;
        context.fillStyle = color;
        context.textAlign = "center";
        context.textBaseline = "middle";
        let fittedFont = font;
        let size = Number(font.match(/(\d+)px/)?.[1] || 18);
        while (context.measureText(text).width > maxWidth && size > 13) {
          size -= 1;
          fittedFont = font.replace(/\d+px/, `${size}px`);
          context.font = fittedFont;
        }
        context.fillText(text, x, y, maxWidth);
      }

      async function getFullBadgePngBlob(student, card) {
        const canvas = card.querySelector(".badge-qr-container canvas");
        if (!canvas) throw new Error("Student QR code is not ready. Please try again.");

        const output = document.createElement("canvas");
        output.width = 840;
        output.height = 1280;
        const context = output.getContext("2d");
        if (!context) throw new Error("Your browser could not prepare the student badge image.");
        context.scale(2, 2);

        drawRoundedRect(context, 12, 12, 396, 616, 28, "#FFFFFF", "#E2E8F0", 2);
        context.font = '800 13px "Nunito", "Noto Sans Tamil", sans-serif';
        context.fillStyle = "#6C5CE7";
        context.textAlign = "left";
        context.textBaseline = "middle";
        context.fillText(`🦜 ${student.school || "RHS"} · TBTA TAMIL`, 36, 52, 200);

        drawRoundedRect(context, 264, 31, 120, 36, 18, "#DCFCE7");
        drawCenteredText(context, `${student.grade}-ஆம் வகுப்பு`, 324, 49, 108, '800 13px "Noto Sans Tamil", "Nunito", sans-serif', "#166534");

        context.beginPath();
        context.setLineDash([3, 4]);
        context.moveTo(36, 84);
        context.lineTo(384, 84);
        context.strokeStyle = "#CBD5E1";
        context.lineWidth = 1;
        context.stroke();
        context.setLineDash([]);

        drawCenteredText(context, `${student.firstName} ${student.lastName}`, 210, 117, 348, '800 25px "Nunito", "Noto Sans Tamil", sans-serif', "#0F172A");
        drawCenteredText(context, `${student.school || "RHS"} · Nilai ${student.grade} மாணவர்`, 210, 151, 348, '500 14px "Noto Sans Tamil", "Nunito", sans-serif', "#64748B");

        drawRoundedRect(context, 110, 178, 200, 200, 18, "#F8FAFC", "#CBD5E1", 2);
        context.drawImage(canvas, 128, 196, 164, 164);

        const studentId = student.id || `TBTA-G${student.grade}-${String(allStudents.indexOf(student) + 1).padStart(2, "0")}`;
        drawCenteredText(context, `ID: ${studentId}`, 210, 400, 348, '700 15px "Nunito", sans-serif', "#64748B");
        drawCenteredText(context, "📸 Scan to Login", 210, 430, 348, '700 14px "Nunito", "Noto Sans Tamil", sans-serif', "#059669");

        drawRoundedRect(context, 34, 453, 352, 48, 24, "#F1F5F9", "#CBD5E1");
        drawCenteredText(context, "🚀 வாசிப்பு மன்றத்தில் தொடங்கு ➜", 210, 477, 324, '700 15px "Noto Sans Tamil", "Nunito", sans-serif', "#1E293B");

        drawRoundedRect(context, 78, 516, 264, 42, 21, "#EEF2FF", "#C7D2FE");
        drawCenteredText(context, "⬇️ Download full badge (PNG)", 210, 537, 244, '700 13px "Nunito", sans-serif', "#4338CA");

        return new Promise((resolve, reject) => {
          output.toBlob(blob => blob ? resolve(blob) : reject(new Error("Could not export full student badge image.")), "image/png");
        });
      }

      function downloadBlob(blob, filename) {
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        link.remove();
        window.setTimeout(() => URL.revokeObjectURL(url), 1000);
      }

      function safeFileName(value) {
        return String(value).normalize("NFKD").replace(/[^\w.-]+/g, "_").replace(/^_+|_+$/g, "") || "student";
      }

      async function downloadStudentQr(studentId) {
        const card = [...grid.querySelectorAll(".student-badge-card[data-student-id]")]
          .find(element => element.dataset.studentId === studentId);
        if (!card) throw new Error("Student QR badge is not visible.");
        const student = allStudents.find(item => getStudentKey(item) === studentId);
        if (!student) throw new Error("Student details are unavailable.");
        const blob = await getFullBadgePngBlob(student, card);
        downloadBlob(blob, `${safeFileName(card.dataset.studentName)}_full_badge.png`);
      }

      function crc32(bytes) {
        let crc = 0xFFFFFFFF;
        for (const byte of bytes) {
          crc ^= byte;
          for (let bit = 0; bit < 8; bit += 1) {
            crc = (crc >>> 1) ^ ((crc & 1) ? 0xEDB88320 : 0);
          }
        }
        return (crc ^ 0xFFFFFFFF) >>> 0;
      }

      function createZip(files) {
        const encoder = new TextEncoder();
        const localParts = [];
        const centralParts = [];
        let offset = 0;
        const now = new Date();
        const dosTime = (now.getHours() << 11) | (now.getMinutes() << 5) | Math.floor(now.getSeconds() / 2);
        const dosDate = ((Math.max(1980, now.getFullYear()) - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate();

        files.forEach(file => {
          const nameBytes = encoder.encode(file.name);
          const data = new Uint8Array(file.data);
          const checksum = crc32(data);
          const localHeader = new Uint8Array(30 + nameBytes.length);
          const localView = new DataView(localHeader.buffer);
          localView.setUint32(0, 0x04034B50, true);
          localView.setUint16(4, 20, true);
          localView.setUint16(6, 0x0800, true);
          localView.setUint16(8, 0, true);
          localView.setUint16(10, dosTime, true);
          localView.setUint16(12, dosDate, true);
          localView.setUint32(14, checksum, true);
          localView.setUint32(18, data.length, true);
          localView.setUint32(22, data.length, true);
          localView.setUint16(26, nameBytes.length, true);
          localHeader.set(nameBytes, 30);
          localParts.push(localHeader, data);

          const centralHeader = new Uint8Array(46 + nameBytes.length);
          const centralView = new DataView(centralHeader.buffer);
          centralView.setUint32(0, 0x02014B50, true);
          centralView.setUint16(4, 20, true);
          centralView.setUint16(6, 20, true);
          centralView.setUint16(8, 0x0800, true);
          centralView.setUint16(10, 0, true);
          centralView.setUint16(12, dosTime, true);
          centralView.setUint16(14, dosDate, true);
          centralView.setUint32(16, checksum, true);
          centralView.setUint32(20, data.length, true);
          centralView.setUint32(24, data.length, true);
          centralView.setUint16(28, nameBytes.length, true);
          centralView.setUint32(42, offset, true);
          centralHeader.set(nameBytes, 46);
          centralParts.push(centralHeader);
          offset += localHeader.length + data.length;
        });

        const centralSize = centralParts.reduce((total, part) => total + part.length, 0);
        const endRecord = new Uint8Array(22);
        const endView = new DataView(endRecord.buffer);
        endView.setUint32(0, 0x06054B50, true);
        endView.setUint16(8, files.length, true);
        endView.setUint16(10, files.length, true);
        endView.setUint32(12, centralSize, true);
        endView.setUint32(16, offset, true);
        return new Blob([...localParts, ...centralParts, endRecord], { type: "application/zip" });
      }

      async function downloadFilteredBatch() {
        const students = getVisibleStudents();
        if (!students.length) return;
        batchButton.disabled = true;
        batchStatus.textContent = "Preparing QR batch…";
        try {
          const files = [];
          for (const student of students) {
            const studentKey = getStudentKey(student);
            const card = [...grid.querySelectorAll(".student-badge-card[data-student-id]")]
              .find(element => element.dataset.studentId === studentKey);
            if (!card) throw new Error(`QR badge is not ready for ${student.firstName} ${student.lastName}.`);
            const blob = await getFullBadgePngBlob(student, card);
            files.push({
              name: `${safeFileName(student.firstName)}_${safeFileName(student.lastName)}_G${student.grade}_${safeFileName(student.id || `Roster-${allStudents.indexOf(student) + 1}`)}_full_badge.png`,
              data: await blob.arrayBuffer()
            });
          }
          const zip = createZip(files);
          const clubPart = getSelectedClubs().length ? `_${getSelectedClubs().join("-")}` : "";
          const gradePart = currentGradeFilter === "all" ? "" : `_Grade-${currentGradeFilter}`;
          downloadBlob(zip, `student_QR_batch${clubPart}${gradePart}.zip`);
          batchStatus.textContent = `Downloaded ${files.length} full student badges.`;
        } catch (error) {
          console.error("Could not download QR batch:", error);
          batchStatus.textContent = error.message || "Could not download the QR batch.";
        } finally {
          batchButton.disabled = false;
        }
      }

      async function init() {
        try {
          const [res, enrollmentRes] = await Promise.all([
            fetch("data/students/roster.json"),
            fetch("data/students/club_enrollments.json").catch(() => null)
          ]);
          if (!res.ok) throw new Error(`Roster request failed (${res.status})`);
          const data = await res.json();
          let customStudents = [];
          try { customStudents = JSON.parse(localStorage.getItem(CUSTOM_STUDENTS_KEY) || "[]"); } catch (_) {}
          let enrollments = {};
          try {
            const localEnrollments = localStorage.getItem("tbta_student_club_enrollments");
            enrollments = localEnrollments ? JSON.parse(localEnrollments) : enrollmentRes && enrollmentRes.ok ? await enrollmentRes.json() : {};
          } catch (_) {
            enrollments = enrollmentRes && enrollmentRes.ok ? await enrollmentRes.json() : {};
          }
          studentEnrollments = enrollments;
          allStudents = [...(Array.isArray(data.students) ? data.students : []), ...(Array.isArray(customStudents) ? customStudents : [])].map(student => {
            const key = student.id || `${student.firstName}_${student.lastName}_G${student.grade}`;
            const assignedSchool = enrollments[key] && enrollments[key].school;
            return {
              ...student,
              school: SCHOOLS.includes(assignedSchool) ? assignedSchool : (SCHOOLS.includes(student.school) ? student.school : "RHS")
            };
          });
          document.getElementById("students-role-tab").textContent = `👨‍🎓 மாணவர்கள் மட்டும் (Students - ${allStudents.length})`;
          renderBadges();
        } catch (err) {
          console.error("Failed to load roster:", err);
          allStudents = [];
          renderBadges();
        }

        searchInput.addEventListener("input", (e) => {
          currentSearchQuery = e.target.value.trim().toLowerCase();
          renderBadges();
        });

        roleTabs.forEach(tab => {
          tab.addEventListener("click", () => {
            roleTabs.forEach(t => t.classList.remove("active"));
            tab.classList.add("active");
            currentRoleTab = tab.getAttribute("data-role");

            // Show or hide grade tabs when viewing teacher or admin
            if (currentRoleTab === "teacher" || currentRoleTab === "admin") {
              gradeTabsContainer.style.display = "none";
              clubFilters.style.display = "none";
              batchButton.parentElement.style.display = "none";
            } else {
              gradeTabsContainer.style.display = "flex";
              clubFilters.style.display = "flex";
              batchButton.parentElement.style.display = "flex";
            }

            renderBadges();
          });
        });

        gradeTabs.forEach(tab => {
          tab.addEventListener("click", () => {
            gradeTabs.forEach(t => t.classList.remove("active"));
            tab.classList.add("active");
            currentGradeFilter = tab.getAttribute("data-grade");
            renderBadges();
          });
        });

        clubFilters.querySelectorAll('input[type="checkbox"]').forEach(input => {
          input.addEventListener("change", () => {
            if (getSelectedClubs().length) {
              const studentsTab = document.querySelector('.role-tab-btn[data-role="students"]');
              if (studentsTab && currentRoleTab !== "students") studentsTab.click();
            } else {
              renderBadges();
            }
          });
        });

        batchButton.addEventListener("click", downloadFilteredBatch);

        if (printBtn) {
          printBtn.addEventListener("click", () => window.print());
        }

        // Check URL hash for direct filter
        if (window.location.hash === "#teacher") {
          const tTab = document.querySelector('.role-tab-btn[data-role="teacher"]');
          if (tTab) tTab.click();
        } else if (window.location.hash === "#admin") {
          const aTab = document.querySelector('.role-tab-btn[data-role="admin"]');
          if (aTab) aTab.click();
        } else if (window.location.hash.startsWith("#student=")) {
          const studentKey = decodeURIComponent(window.location.hash.slice("#student=".length));
          const student = allStudents.find(s => (s.id || `${s.firstName}_${s.lastName}_G${s.grade}`) === studentKey);
          if (student) {
            currentRoleTab = "students";
            currentStudentIdFilter = student.id || `${student.firstName}_${student.lastName}_G${student.grade}`;
            currentGradeFilter = String(student.grade);
            gradeTabs.forEach(tab => {
              tab.classList.toggle("active", tab.getAttribute("data-grade") === currentGradeFilter);
            });
            document.querySelector('.role-tab-btn[data-role="students"]')?.click();
            currentSearchQuery = `${student.firstName} ${student.lastName}`.toLowerCase();
            searchInput.value = `${student.firstName} ${student.lastName}`;
            renderBadges();
          }
        }
      }

      function renderBadges() {
        grid.innerHTML = "";
        let itemsToRender = [];
        const selectedClubs = getSelectedClubs();

        // 1. Staff Badges
        if (currentRoleTab === "all" || currentRoleTab === "teacher" || currentRoleTab === "admin") {
          STAFF_BADGES.forEach(staff => {
            if (currentRoleTab === "teacher" && staff.role !== "teacher") return;
            if (currentRoleTab === "admin" && staff.role !== "admin") return;
            
            const matchSearch = !currentSearchQuery || 
              staff.fullName.toLowerCase().includes(currentSearchQuery) || 
              staff.id.toLowerCase().includes(currentSearchQuery) ||
              staff.role.toLowerCase().includes(currentSearchQuery);

            if (matchSearch) {
              itemsToRender.push({
                isStaff: true,
                staff
              });
            }
          });
        }

        // 2. Student Badges
        if (currentRoleTab === "all" || currentRoleTab === "students") {
          allStudents.forEach((student, index) => {
            const matchesGrade = (currentGradeFilter === "all" || String(student.grade) === String(currentGradeFilter));
            const fullName = `${student.firstName} ${student.lastName}`.toLowerCase();
            const matchesSearch = !currentSearchQuery || fullName.includes(currentSearchQuery);
            const studentKey = student.id || `${student.firstName}_${student.lastName}_G${student.grade}`;
            const matchesStudentId = !currentStudentIdFilter || studentKey === currentStudentIdFilter;
            const matchesClubs = !selectedClubs.length || getStudentClubs(student).some(club => selectedClubs.includes(club));

            if (matchesGrade && matchesSearch && matchesStudentId && matchesClubs) {
              itemsToRender.push({
                isStaff: false,
                student,
                index
              });
            }
          });
        }

        if (!itemsToRender.length) {
          batchCount.textContent = "0 students selected";
          batchButton.disabled = true;
          grid.innerHTML = `<div class="no-results-box"><h3>பொருத்தமான அடையாள அட்டைகள் எவையும் இல்லை (No badges found)</h3></div>`;
          return;
        }

        const visibleStudentCount = itemsToRender.filter(item => !item.isStaff).length;
        batchCount.textContent = `${visibleStudentCount} student${visibleStudentCount === 1 ? "" : "s"} in this batch`;
        batchButton.disabled = visibleStudentCount === 0;

        itemsToRender.forEach((item, idx) => {
          if (item.isStaff) {
            const staff = item.staff;
            const card = document.createElement("div");
            card.className = `student-badge-card ${staff.cardClass}`;
            const qrBoxId = `qr-box-staff-${staff.role}-${idx}`;

            card.innerHTML = `
              <div class="badge-top-strip">
                <span class="badge-school-tag">🦜 TBTA TAMIL</span>
                <span class="badge-grade-pill ${staff.pillClass}">${staff.pillText}</span>
              </div>
              <div class="badge-student-name">${staff.fullName}</div>
              <div class="badge-sub-title">${staff.subtitle}</div>
              <div class="badge-qr-container" id="${qrBoxId}"></div>
              <div class="badge-id-tag">ID: ${staff.id}</div>
              <div class="badge-scan-hint">📸 Scan in App Camera to Login</div>
              <a href="${staff.loginUrl}" class="badge-quick-launch-btn">🚀 இந்த கணக்கில் உள்நுழை (Launch in App)</a>
            `;

            grid.appendChild(card);

            const qrBox = card.querySelector(`#${qrBoxId}`);
            if (window.QRCode && qrBox) {
              new QRCode(qrBox, {
                text: staff.qrPayload,
                width: 140,
                height: 140,
                colorDark: staff.role === "teacher" ? "#065F46" : "#4C1D95",
                colorLight: "#FFFFFF",
                correctLevel: QRCode.CorrectLevel.M
              });
            }
          } else {
            const student = item.student;
            const fullName = `${student.firstName} ${student.lastName}`;
            const studentId = student.id || `TBTA-G${student.grade}-${String(item.index + 1).padStart(2, "0")}`;
            const qrBoxId = `qr-box-student-${student.grade}-${idx}`;

            const qrPayload = getStudentQrPayload(student);

            const card = document.createElement("div");
            card.className = "student-badge-card";
            card.dataset.studentId = getStudentKey(student);
            card.dataset.studentName = fullName;
            card.innerHTML = `
              <div class="badge-top-strip">
                <span class="badge-school-tag">🦜 ${escapeHtml(student.school || "RHS")} · TBTA TAMIL</span>
                <span class="badge-grade-pill grade-${student.grade}">${student.grade}-ஆம் வகுப்பு</span>
              </div>
              <div class="badge-student-name">${escapeHtml(fullName)}</div>
              <div class="badge-sub-title">${escapeHtml(student.school || "RHS")} · Nilai ${escapeHtml(student.grade)} மாணவர்</div>
              <div class="badge-qr-container" id="${qrBoxId}"></div>
              <div class="badge-id-tag">ID: ${studentId}</div>
              <div class="badge-scan-hint">📸 Scan to Login</div>
              <a href="index.html#student=${encodeURIComponent(student.id || `${student.firstName}_${student.lastName}_G${student.grade}`)}&first=${encodeURIComponent(student.firstName)}&last=${encodeURIComponent(student.lastName)}&grade=${encodeURIComponent(student.grade)}&school=${encodeURIComponent(student.school || "RHS")}&clubs=${encodeURIComponent(JSON.stringify((studentEnrollments[student.id || `${student.firstName}_${student.lastName}_G${student.grade}`] || {}).clubs || []))}&screen=reading-club&pdf=pdf-stage2-assign3" class="badge-quick-launch-btn">🚀 வாசிப்பு மன்றத்தில் தொடங்கு ➜</a>
              <button type="button" class="badge-card-download-btn" data-download-student="${escapeHtml(getStudentKey(student))}">⬇️ Download full badge (PNG)</button>
            `;

            grid.appendChild(card);

            const qrBox = card.querySelector(`#${qrBoxId}`);
            if (window.QRCode && qrBox) {
              new QRCode(qrBox, {
                text: qrPayload,
                width: 140,
                height: 140,
                colorDark: "#1E1B4B",
                colorLight: "#FFFFFF",
                correctLevel: QRCode.CorrectLevel.M
              });
            }
            card.querySelector(".badge-card-download-btn").addEventListener("click", async () => {
              batchStatus.textContent = "";
              try {
                await downloadStudentQr(getStudentKey(student));
                batchStatus.textContent = `Downloaded full badge for ${fullName}.`;
              } catch (error) {
                console.error("Could not download student QR:", error);
                batchStatus.textContent = error.message || "Could not download this QR code.";
              }
            });
          }
        });
      }

      document.addEventListener("DOMContentLoaded", init);
    })();
  </script>
</body>
</html>
